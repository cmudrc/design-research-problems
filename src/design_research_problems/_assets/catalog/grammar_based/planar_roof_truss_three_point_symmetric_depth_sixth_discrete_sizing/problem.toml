problem_id = "planar_roof_truss_three_point_symmetric_depth_sixth_discrete_sizing"
title = "Planar roof truss grammar (depth = 1/6 span, discrete sizing)"
summary = "A symmetric three-point roof-truss grammar aligned to the 1/6-span depth case with discrete member sizing from the structural essay study."
kind = "grammar"
statement = '''
# Planar roof truss grammar (depth = 1/6 span, discrete sizing)

This catalog entry approximates the fourth planar roof-truss formulation from
the structural essay study: the symmetric three-point loading case with the
1/6-span depth envelope and discrete member sizes.

The current grammar aligns the topology and envelope constraints with that
study variant. Its evaluator still uses the default `trussme` member creation
path, so the member-size discreteness is represented in the packaged problem
formulation rather than a separate sizing action in the simplified state model.
'''
implementation = "design_research_problems.problems.grammar._planar_truss:PlanarTrussSpanProblem"
capabilities = [
  "statement-markdown",
  "serializable-state",
  "discrete-actions",
  "optional-evaluator",
  "external-adapter",
]
study_suitability = []

