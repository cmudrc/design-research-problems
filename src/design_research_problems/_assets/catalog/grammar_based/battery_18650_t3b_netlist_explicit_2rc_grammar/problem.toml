problem_id = "battery_18650_t3b_netlist_explicit_2rc_grammar"
title = "T3B 18650 netlist explicit 2-RC grammar"
summary = "Tier-3B explicit-netlist grammar variant that uses a manifest-selected PyBaMM 2-RC backend configuration."
kind = "grammar"
statement = '''
# T3B 18650 netlist explicit 2-RC grammar

Tier 3B exposes the explicit battery netlist as the native design
representation. This packaged variant keeps the same explicit cells,
terminals, and interconnect editing contract while selecting a shared 2-RC
backend configuration directly from the manifest.

The grammar operates directly on explicit cells and interconnects. Topology
quality is not only about cell count; stage balance matters. If n_i is stage
population:
- P_eq = min_i(n_i)
- C_pack ~= P_eq * C_cell
- I_limit ~= P_eq * C_cell * C_rate_max

This creates constructive pressure for balanced stage populations while still
allowing open-ended wiring edits.
'''
implementation = "design_research_problems.problems.grammar._battery_tiers:Battery18650T3BNetlistExplicitGrammarProblem"
capabilities = [
  "statement-markdown",
  "serializable-state",
  "discrete-actions",
  "optional-evaluator",
  "external-adapter",
]
study_suitability = []

[benchmark]
benchmark_question = "How well do grammar methods synthesize explicit battery netlists when structure and wiring are first-class design decisions?"
physically_modeled = [
  "Explicit cells, terminals, and interconnects",
  "Shared explicit-circuit validation and discharge simulation",
  "A manifest-selected 2-RC backend configuration for backend-fidelity studies",
]
deliberate_surrogates = [
  "The grammar representation is explicit-netlist rather than pose-native",
  "Thermal behavior remains a low-order proxy layered on top of the explicit circuit backend",
]
representation_mode = "explicit_netlist"
default_evaluation_mode = "explicit_circuit"
supported_evaluation_modes = ["explicit_circuit", "hybrid_thermal"]
validation_scope = [
