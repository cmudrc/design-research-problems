problem_id = "battery_pack_18650_series_parallel"
title = "T1 18650 series-parallel battery-pack co-design grammar"
summary = "A constrained grammar for repositioning 18650 cells and editing whole series stages or parallel branches in a rectangular SxP battery pack."
kind = "grammar"
statement = '''
# T1 18650 series-parallel battery-pack co-design grammar

Design a battery pack using 18650 cells under a constrained series-parallel
topology. The pack always forms a complete rectangular grid of logical
electrical slots: `S` series stages by `P` parallel branches, with exactly one
physical cell per slot. Designers may reposition cells in space, add a full new
series stage, remove the final series stage, add a full new parallel branch, or
remove the final parallel branch.

The benchmark target is a `14.8V` pack with at least `10Ah` capacity and at
least `60A` continuous current, under a `500mm x 500mm x 250mm` envelope.
Evaluation uses deterministic geometry and coarse thermal checks plus an
optional PyBaMM-backed representative-cell discharge simulation.
'''
implementation = "design_research_problems.problems.grammar._battery_pack_sp:BatteryPack18650SeriesParallelProblem"
