kind = "grammar"
statement = '''
# Tier 2 18650 battery grammar (pose-aware layout)

Tier 2 keeps Tier-1 topology semantics but expands geometric design freedom by
allowing per-cell pose adjustments in millimeters and degrees.

This rung introduces packing/orientation tradeoffs under spacing and envelope
constraints while retaining a constrained electrical structure.
'''
