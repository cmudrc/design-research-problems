problem_id = "battery_18650_t2_pose_surrogate_grammar"
title = "T2 18650 pose surrogate grammar"
summary = "Tier-2 pose-aware battery grammar benchmark with analytic-surrogate electrical and thermal scoring."
kind = "grammar"
statement = '''
# T2 18650 pose surrogate grammar

Tier 2 keeps Tier-1 topology semantics but expands geometric design freedom by
allowing per-cell pose adjustments in millimeters and degrees.

This rung introduces packing/orientation tradeoffs under spacing and envelope
constraints while retaining a constrained electrical structure.

State edits include local changes to:
- S and P counts
- per-cell [x, y, z, angle_x, angle_y, angle_z] controls

Evaluation preserves tier-1 electrical equations and adds an oriented-cylinder
geometry model with minimum surface-clearance feasibility checks and bounding
box volume computation.
'''
implementation = "design_research_problems.problems.grammar._battery_tiers:Battery18650T2PoseSurrogateGrammarProblem"
capabilities = [
  "statement-markdown",
  "serializable-state",
  "discrete-actions",
  "external-adapter",
]
study_suitability = []

[benchmark]
benchmark_question = "How well do grammar methods explore continuous-like pose choices when topology is still rectangular?"
physically_modeled = [
  "Oriented-cylinder clearance and envelope geometry",
  "Pose-aware packing and spacing constraints",
  "Shared low-order thermal proxy",
]
deliberate_surrogates = [
  "Topology remains rectangular and electrically analytic",
  "Backend configuration is accepted for provenance but not applied end-to-end",
]
representation_mode = "pose_layout"
default_evaluation_mode = "analytic_surrogate"
supported_evaluation_modes = ["analytic_surrogate"]
validation_scope = [
  "Geometric validity checks",
  "Monotonicity and deterministic surrogate checks",
]
solver_role = "grammar benchmark; no packaged optimizer"

[parameters]
evaluation_mode = "analytic_surrogate"
target_voltage_v = 14.8
minimum_capacity_ah = 10.0
minimum_current_a = 60.0
max_width_mm = 500.0
max_depth_mm = 500.0
max_height_mm = 250.0
voltage_tolerance_v = 0.1
max_cell_count = 24
minimum_spacing_mm = 2.0
cooling_coefficient_w_per_m2k = 18.0
passive_cooling_w_per_k = 1.0
ambient_temperature_c = 25.0
maximum_temperature_c = 60.0
load_current_a = 60.0
objective_weights = { volume = 0.45, cost = 0.35, temperature = 0.20 }

[taxonomy]
formulation = "discrete_grammar"
convexity = "not_applicable"
design_variable_type = "mixed"
is_dynamic = false
orientation = "engineering_practical"
feasibility_ratio_hint = 0.05
objective_mode = "multi"
constraint_nature = "hard"
bounds_summary = "SxP decisions plus per-cell pose controls [x,y,z,ax,ay,az]"
tags = ["grammar", "battery", "tiered", "tier-2", "pose-layout", "surrogate"]
