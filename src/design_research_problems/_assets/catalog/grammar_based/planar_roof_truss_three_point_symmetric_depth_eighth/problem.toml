problem_id = "planar_roof_truss_three_point_symmetric_depth_eighth"
title = "Planar roof truss grammar (depth = 1/8 span)"
summary = "A symmetric three-point roof-truss grammar constrained to the shallow 1/8-span depth variant reported in the structural essay study."
kind = "grammar"
statement = '''
# Planar roof truss grammar (depth = 1/8 span)

This catalog entry approximates the second planar roof-truss formulation from
the structural essay study: the symmetric three-point loading case with the
truss depth constrained to approximately one-eighth of the span.

The simplified grammar captures that shallower design envelope by reducing the
roof rise used to place the fixed load joints and candidate interior joints. It
keeps the same symmetric edit rules as the base three-point variant.
'''
implementation = "design_research_problems.problems.grammar._planar_truss:PlanarTrussSpanProblem"
capabilities = [
  "statement-markdown",
  "serializable-state",
  "discrete-actions",
  "optional-evaluator",
  "external-adapter",
]
study_suitability = []

