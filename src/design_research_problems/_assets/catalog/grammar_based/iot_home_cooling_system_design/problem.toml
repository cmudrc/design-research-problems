problem_id = "iot_home_cooling_system_design"
title = "IoT home cooling-system co-design grammar problem"
summary = "A bounded IoT grammar for placing processors, sensors, and coolers in a fixed home geometry and evaluating lifecycle cost and thermal peak with a MATLAB-parity simulator."
kind = "grammar"
statement = '''
# IoT home cooling-system co-design grammar problem

Design a home cooling IoT network over a fixed house layout. The grammar allows
adding processors, sensors, and coolers, moving products across a finite set of
study-derived placement points, editing links, deleting products/links, and
tuning cooler settings (`BTU/h`, `CFM`).

The evaluator ports the original MATLAB study mechanics into deterministic
Python: directed decision pathways, room-level airflow balance, temperature
updates with conduction and leaks, and lifecycle costing (capital + operation).
The reported metrics are `total_cost`, `peak_temp_c`, `capital_cost`, and
`operation_cost`.
'''
implementation = "design_research_problems.problems.grammar._iot_home:IoTHomeCoolingGrammarProblem"
capabilities = [
  "statement-markdown",
  "serializable-state",
  "discrete-actions",
  "external-adapter",
]
