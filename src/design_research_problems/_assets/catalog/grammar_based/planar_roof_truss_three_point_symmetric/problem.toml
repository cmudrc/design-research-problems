span = 10.0
max_height = 2.5
load_magnitude = 1000.0
roof_load_x_fractions = [0.25, 0.5, 0.75]
candidate_point_fractions = [[0.2, 0.2], [0.35, 0.32], [0.5, 0.22]]
enforce_symmetry = true

