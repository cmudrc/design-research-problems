problem_id = "planar_roof_truss_three_point_symmetric"
title = "Planar roof truss grammar (three-point symmetric variant)"
summary = "A simplified roof-truss grammar aligned to the three-point symmetric formulation reported by Shea and Cagan."
kind = "grammar"
statement = '''
# Planar roof truss grammar (three-point symmetric variant)

This catalog entry approximates the first planar roof-truss formulation reported
in the structural essay study by Shea and Cagan: a symmetric roof truss with
three roof load points. In the original study, the two outer load points could
translate along the roofline. This simplified grammar fixes them at quarter-span
locations while preserving the same symmetric three-point loading topology.

The state begins with pinned and roller supports plus three loaded roof joints.
Designers add interior joints and members, and mirrored edits are enforced so
the topology remains symmetric about mid-span.
'''
implementation = "design_research_problems.problems.grammar._planar_truss:PlanarTrussSpanProblem"
capabilities = [
  "statement-markdown",
  "serializable-state",
  "discrete-actions",
  "optional-evaluator",
  "external-adapter",
]
