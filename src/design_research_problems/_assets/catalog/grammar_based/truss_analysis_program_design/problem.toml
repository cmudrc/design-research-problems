problem_id = "truss_analysis_program_design"
title = "Truss Analysis Program grammar problem"
summary = "A bounded planar truss grammar ported from the MATLAB Truss Analysis Program, including direct-stiffness evaluation, factor-of-safety checks, and mass computation."
kind = "grammar"
statement = '''
# Truss Analysis Program grammar problem

Design a planar truss over fixed support and load anchor joints using discrete
editing actions inspired by the original MATLAB Truss Analysis Program:
add/move/delete editable joints, add/delete members, resize members, toggle
supports, and set directional loads.

The evaluator reproduces the study mechanics with a direct-stiffness solve,
member-level force and factor-of-safety calculations, and a section-based mass
model. It reports `mass_kg`, `min_fos`, `is_stable`, and `is_acceptable`.
'''
implementation = "design_research_problems.problems.grammar._truss_ap:TrussAPGrammarProblem"
capabilities = [
  "statement-markdown",
  "serializable-state",
  "discrete-actions",
  "external-adapter",
]
study_suitability = []

