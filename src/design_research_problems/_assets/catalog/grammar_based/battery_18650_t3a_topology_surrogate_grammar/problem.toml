problem_id = "battery_18650_t3a_topology_surrogate_grammar"
title = "T3A 18650 topology surrogate grammar"
summary = "Tier-3A topology-allocation battery grammar benchmark with switchable surrogate or projected explicit-circuit scoring."
kind = "grammar"
statement = '''
# T3A 18650 topology surrogate grammar

Tier 3A introduces explicit topology-allocation variables while keeping a
typed vector state instead of a free-form netlist. Designers edit active cell
count, series-stage count, pose variables, and stage-slot assignments.

This rung is intended to benchmark allocation asymmetry and imbalance handling.
By default, usable parallel support is the minimum stage population, but the
benchmark can also swap in an alternative imbalance abstraction.

Evaluation modes:
- analytic_surrogate: stage-allocation surrogate with pose-aware geometry
- explicit_circuit: project the allocation to a canonical explicit netlist for
  electrical scoring while keeping pose-native geometry metrics
'''
implementation = "design_research_problems.problems.grammar._battery_tiers:Battery18650T3ATopologySurrogateGrammarProblem"
capabilities = [
  "statement-markdown",
  "serializable-state",
  "discrete-actions",
  "external-adapter",
]
study_suitability = []

[benchmark]
benchmark_question = "How well do grammar methods handle topology allocation and stage imbalance when candidate structure becomes asymmetric?"
physically_modeled = [
  "Per-cell pose geometry with oriented-cylinder clearance checks",
  "Variable active cell count and explicit stage-slot allocation",
  "Optional projection to an explicit-circuit evaluator for electrical scoring",
]
deliberate_surrogates = [
  "Stage imbalance is represented by a configurable benchmark abstraction",
  "Explicit-circuit evaluation uses a canonical projection rather than the native pose representation",
  "Thermal behavior remains a steady-state Joule-heating proxy",
]
representation_mode = "topology_allocation"
default_evaluation_mode = "analytic_surrogate"
supported_evaluation_modes = ["analytic_surrogate", "explicit_circuit"]
validation_scope = [
  "Topology-abstraction sanity checks",
  "Projected explicit-circuit consistency checks",
]
solver_role = "grammar benchmark; no packaged optimizer"

[parameters]
evaluation_mode = "analytic_surrogate"
imbalance_model = "min_stage"
target_voltage_v = 14.8
minimum_capacity_ah = 10.0
minimum_current_a = 60.0
max_width_mm = 500.0
max_depth_mm = 500.0
max_height_mm = 250.0
voltage_tolerance_v = 0.1
max_cell_count = 24
minimum_spacing_mm = 2.0
cooling_coefficient_w_per_m2k = 18.0
passive_cooling_w_per_k = 1.0
ambient_temperature_c = 25.0
maximum_temperature_c = 60.0
load_current_a = 60.0
objective_weights = { volume = 0.40, cost = 0.30, temperature = 0.30 }

[taxonomy]
formulation = "discrete_grammar"
convexity = "not_applicable"
design_variable_type = "mixed"
is_dynamic = false
orientation = "engineering_practical"
feasibility_ratio_hint = 0.03
objective_mode = "multi"
constraint_nature = "hard"
bounds_summary = "cell-count and stage-allocation topology variables plus per-cell pose controls"
tags = ["grammar", "battery", "tiered", "tier-3a", "topology-allocation", "surrogate"]
