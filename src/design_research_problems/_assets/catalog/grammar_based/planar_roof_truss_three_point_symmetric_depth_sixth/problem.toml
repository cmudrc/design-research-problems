problem_id = "planar_roof_truss_three_point_symmetric_depth_sixth"
title = "Planar roof truss grammar (depth = 1/6 span)"
summary = "A symmetric three-point roof-truss grammar constrained to the 1/6-span depth variant reported in the structural essay study."
kind = "grammar"
statement = '''
# Planar roof truss grammar (depth = 1/6 span)

This catalog entry approximates the third planar roof-truss formulation from
the structural essay study: the symmetric three-point loading case with the
depth limit relaxed to approximately one-sixth of the span.

Relative to the 1/8-span variant, the load joints and candidate interior joints
are placed in a taller envelope to reflect the larger allowable truss depth.
'''
implementation = "design_research_problems.problems.grammar._planar_truss:PlanarTrussSpanProblem"
capabilities = [
  "statement-markdown",
  "serializable-state",
  "discrete-actions",
  "optional-evaluator",
  "external-adapter",
]
study_suitability = []

