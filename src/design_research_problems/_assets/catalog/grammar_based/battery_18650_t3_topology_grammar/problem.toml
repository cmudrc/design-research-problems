# Tier 3 18650 battery grammar (explicit topology)

Tier 3 adds explicit topology/wiring freedom and variable active-cell count to
the pose-aware layout space. Designers can add/remove/move cells and edit
interconnects directly in the explicit battery graph.

This rung introduces meaningful electrical-topology variability beyond fixed
rectangular assumptions.
'''
