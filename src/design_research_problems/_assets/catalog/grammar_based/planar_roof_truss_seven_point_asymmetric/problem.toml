problem_id = "planar_roof_truss_seven_point_asymmetric"
title = "Planar roof truss grammar (seven-point asymmetric variant)"
summary = "A roof-truss grammar aligned to the seven-point asymmetric loading formulation reported in the structural essay study."
kind = "grammar"
statement = '''
# Planar roof truss grammar (seven-point asymmetric variant)

This catalog entry approximates the fifth planar roof-truss formulation from
the structural essay study: seven uniformly spaced fixed roof load points with
no enforced symmetry.

The state begins with pinned and roller supports plus seven loaded roof joints.
Designers can add interior joints at asymmetric candidate locations, then add
and remove members to explore non-symmetric layouts.
'''
implementation = "design_research_problems.problems.grammar._planar_truss:PlanarTrussSpanProblem"
capabilities = [
  "statement-markdown",
  "serializable-state",
  "discrete-actions",
  "optional-evaluator",
  "external-adapter",
]
study_suitability = []

[parameters]
span = 10.0
max_height = 2.5
load_magnitude = 1000.0
roof_load_x_fractions = [0.125, 0.25, 0.375, 0.5, 0.625, 0.75, 0.875]
candidate_point_fractions = [[0.12, 0.18], [0.3, 0.28], [0.48, 0.18], [0.66, 0.32], [0.84, 0.18]]
enforce_symmetry = false

