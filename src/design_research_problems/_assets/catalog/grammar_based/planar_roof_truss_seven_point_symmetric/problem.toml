kind = "grammar"
statement = '''
# Planar roof truss grammar (seven-point symmetric variant)

This catalog entry approximates the sixth planar roof-truss formulation from
the structural essay study: seven uniformly spaced fixed roof load points with
left-right symmetry enforced.

The state begins with pinned and roller supports plus seven loaded roof joints.
Interior joints and members are edited through mirrored actions so the topology
remains symmetric about the roof apex.
'''
implementation = "design_research_problems.problems.grammar._planar_truss:PlanarTrussSpanProblem"
