problem_id = "planar_truss_span_member_count_min"
title = "Planar truss span topology (member-count minimization)"
summary = "A fixed-joint binary optimization problem that selects candidate planar-truss members to minimize member count while satisfying deterministic topology constraints."
kind = "optimization"
statement = '''
# Planar truss span topology (member-count minimization)

Choose a planar truss topology over a fixed support span and a fixed set of
candidate joints. Each binary design variable decides whether one candidate
member is present. The optimizer builds a concrete `PlanarTrussState` directly
from the shared planar-truss domain primitives and ranks feasible topologies by
the number of realized members.

The built-in baseline uses deterministic graph-theoretic feasibility screens:
the selected members must connect the loaded joint to both supports, keep the
load joint adequately braced, avoid dangling active free joints, satisfy a
simple planar-truss count heuristic, and avoid geometric member crossings.
'''
implementation = "design_research_problems.problems.optimization._truss_topology:PlanarTrussTopologyOptimizationProblem"
capabilities = ["statement-markdown", "bounded-variables", "baseline-solver"]
study_suitability = []

[parameters]
span = 10.0
max_height = 5.0
load_magnitude = 1000.0
objective_metric = "member-count"
candidate_point_fractions = [
  [0.25, 0.5],
  [0.50, 0.5],
  [0.75, 0.5],
]

[taxonomy]
formulation = "binary_optimization"
convexity = "nonconvex"
design_variable_type = "discrete"
is_dynamic = false
orientation = "engineering_practical"
feasibility_ratio_hint = 0.1
objective_mode = "single"
constraint_nature = "hard"
bounds_summary = "one binary variable per candidate member over a fixed planar truss joint set"
tags = ["optimization", "truss", "topology", "binary", "member-count"]
