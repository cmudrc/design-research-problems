problem_id = "space_truss_span_mass_min"
title = "Space truss span structural optimization (mass minimization)"
summary = "A fixed-joint binary optimization problem that selects candidate 3D truss members to minimize mass subject to factor-of-safety and deflection thresholds."
kind = "optimization"
statement = '''
# Space truss span structural optimization (mass minimization)

Choose a 3D space-truss topology over a fixed bridge-like scaffold. Each binary
design variable decides whether one candidate member is present. The optimizer
builds a concrete `SpaceTrussState`, runs the real `trussme` structural
analysis, and minimizes structural mass.

Feasible candidates must satisfy a minimum factor of safety and a maximum
deflection threshold. The built-in baseline uses deterministic binary
enumeration with cheap graph prechecks plus hard structural thresholds.
'''
implementation = "design_research_problems.problems.optimization._truss_topology:SpaceTrussEngineeringOptimizationProblem"
capabilities = ["statement-markdown", "bounded-variables", "baseline-solver", "optional-evaluator", "external-adapter"]
study_suitability = []

[parameters]
span = 10.0
width = 4.0
max_height = 5.0
load_magnitude = 1000.0
objective_metric = "mass-min"
minimum_fos = 1.0
maximum_deflection = 0.20
candidate_point_fractions_3d = [
  [0.25, -1.0, 0.5],
  [0.25, 1.0, 0.5],
  [0.75, -1.0, 0.5],
  [0.75, 1.0, 0.5],
]

[taxonomy]
formulation = "binary_optimization"
convexity = "nonconvex"
design_variable_type = "discrete"
is_dynamic = false
orientation = "engineering_practical"
feasibility_ratio_hint = 0.02
objective_mode = "single"
constraint_nature = "hard"
bounds_summary = "one binary variable per candidate member over a fixed 3D space-truss joint set"
tags = ["optimization", "truss", "3d", "structural", "mass"]
