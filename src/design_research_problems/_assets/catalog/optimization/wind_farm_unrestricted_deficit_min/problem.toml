summary = "A citation-backed continuous wind-farm layout benchmark derived from Quan and Kim's unrestricted MILP formulation, packaged as a compact seven-turbine seed instance."
kind = "optimization"
statement = '''
# Unrestricted wind-farm layout optimization (compact continuous seed)

This packaged optimization problem is a compact, citation-backed seed derived
from Quan and Kim's unrestricted wind-farm layout formulation (2015). The
original paper introduces a mixed-integer linear programming model for placing
wind turbines continuously inside a rectangular field while minimizing the
worst wake-interference penalty across several wind directions.

The in-package benchmark preserves the paper's seven-turbine `650 m x 650 m`
case data, the directional wind table, and the paper's Manhattan-style
exclusion-zone constraint. To keep the benchmark lightweight and reproducible,
the package evaluates layouts with the paper's exact wake-deficit curve instead
of reconstructing the full MILP linearization and branch-and-bound workflow.
Each design variable is one turbine coordinate, so the optimizer searches over
continuous turbine positions rather than a fixed candidate grid.
'''
implementation = "design_research_problems.problems.optimization._wind_farm_unrestricted:UnrestrictedWindFarmLayoutOptimizationProblem"
