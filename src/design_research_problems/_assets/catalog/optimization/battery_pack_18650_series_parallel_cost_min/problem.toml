problem_id = "battery_pack_18650_series_parallel_cost_min"
title = "18650 series-parallel battery-pack sizing (cost minimization)"
summary = "A fixed-topology optimization variant that chooses the rectangular series and parallel counts of an 18650 pack to minimize cost under the packaged battery requirements."
kind = "optimization"
statement = '''
# 18650 series-parallel battery-pack sizing (cost minimization)

Choose the rectangular electrical size of an 18650 battery pack by selecting
the number of series stages `S` and parallel branches `P`. The physical layout
is fixed to the library's canonical one-layer rectangular grid with one cell
per logical slot and deterministic wiring between stages and branches.

The objective is to minimize pack cost while meeting the packaged voltage,
capacity, current, and envelope requirements. This optimization-family variant
reuses the same battery backend as the grammar-family pack problems, but it
restricts the search to canonical rectangular layouts parameterized only by
`S` and `P`.
'''
implementation = "design_research_problems.problems.optimization._battery_grid:BatteryGridSizingProblem"
capabilities = ["statement-markdown", "bounded-variables", "baseline-solver"]
study_suitability = []

[parameters]
target_voltage_v = 14.8
minimum_capacity_ah = 10.0
minimum_current_a = 60.0
max_width_mm = 500.0
max_depth_mm = 500.0
max_height_mm = 250.0
voltage_tolerance_v = 0.1

[taxonomy]
formulation = "mixed_discrete_optimization"
convexity = "nonconvex"
design_variable_type = "discrete"
is_dynamic = false
orientation = "engineering_practical"
feasibility_ratio_hint = 0.1
objective_mode = "single"
constraint_nature = "hard"
bounds_summary = "integer series and parallel counts within the packaged rectangular battery envelope"
tags = ["optimization", "battery", "series-parallel", "grid", "sizing", "cost"]
