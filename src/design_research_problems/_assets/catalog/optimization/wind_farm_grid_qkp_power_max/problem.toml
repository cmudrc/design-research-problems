kind = "inline"
authors = [
  "Ning Quan",
  "Harrison Kim",
]
title = "A Tight Upper Bound for Grid-Based Wind Farm Layout Optimization"
year = 2016
venue = "Proceedings of the ASME 2016 International Design Engineering Technical Conferences and Computers and Information in Engineering Conference"
formatted_text = "Quan and Kim (2016)."
raw_text = "Quan, N., and Kim, H. (2016). A Tight Upper Bound for Grid-Based Wind Farm Layout Optimization. Proceedings of the ASME 2016 International Design Engineering Technical Conferences and Computers and Information in Engineering Conference, DETC2016-59712."

