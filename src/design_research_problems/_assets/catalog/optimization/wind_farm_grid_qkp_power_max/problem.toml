problem_id = "wind_farm_grid_qkp_power_max"
title = "Grid-based wind-farm layout optimization (compact QKP seed)"
summary = "A citation-backed binary wind-farm layout benchmark that packages the Quan and Kim grid-based quadratic-knapsack formulation as a compact fixed-count seed instance."
kind = "optimization"
statement = '''
# Grid-based wind-farm layout optimization (compact QKP seed)

This packaged optimization problem is a compact, citation-backed seed derived
from the grid-based wind-farm layout formulation reported by Quan and Kim
(2016). The original paper studies large mixed-integer and quadratic-knapsack
instances. This in-package benchmark keeps the same binary layout structure and
greedy baseline spirit, but fixes a much smaller `4 x 4` square grid so the
problem is fully specified and reproducible in a lightweight Python package.

Each binary design variable decides whether one turbine is placed on one grid
node. The packaged instance uses a deterministic directional wake-loss proxy to
convert the paper's pairwise interaction idea into a compact expected-power
objective. Exactly four turbines must be placed, and any pair of turbines that
violates the minimum spacing threshold is infeasible.
'''
implementation = "design_research_problems.problems.optimization._wind_farm_layout:WindFarmLayoutOptimizationProblem"
capabilities = [
  "statement-markdown",
  "citation-backed",
  "bounded-variables",
  "equality-constraint",
  "baseline-solver",
]
study_suitability = []

