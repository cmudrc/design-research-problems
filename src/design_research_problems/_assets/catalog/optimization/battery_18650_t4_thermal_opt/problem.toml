problem_id = "battery_18650_t4_thermal_opt"
title = "Tier 4 18650 battery optimization (topology + thermal system)"
summary = "Tier-4 optimization problem that adds thermal-system decision variables to tier-3 topology and pose freedom."
kind = "optimization"
statement = '''
# Tier 4 18650 battery optimization (topology + thermal system)

Optimize battery topology and layout jointly with thermal-system variables for
the highest-freedom battery design rung. Tier-4 thermal evaluation is
**PyBaMM-backed** using 1-RC Thevenin priors (resistance-vs-SOC and thermal
conductance constants).

Tier-4 retains tier-3 topology and geometry decisions and adds:
- convective cooling coefficient h
- passive cooling conductance G_passive
- ambient temperature T_ambient
- thermal model selector: lumped vs multi_node_2node

Thermal heating term (from PyBaMM-derived resistance prior):
- I_cell = I_load / P_eq
- q_i = I_cell^2 * R_eff(SOC_ref)

Lumped mode (ablation):
- T_max = T_ambient + (N_cells * q_i) / G_eff

Multi-node mode (default):
- Nodes are [core_i, surface_i, coolant].
- Core balance: G_cs * (T_core_i - T_surface_i) = q_i
- Surface balance: G_cs(T_surface_i - T_core_i) + sum_j G_ij(T_surface_i - T_surface_j)
  + G_sc,i(T_surface_i - T_cool) = 0
- Coolant balance: sum_i G_sc,i(T_cool - T_surface_i) + G_cool_amb(T_cool - T_ambient) = 0
- Reported T_max is max_i(T_core_i) (conservative hotspot metric).

This tier explicitly exposes thermal-system co-design tradeoffs against pack
size and cell-count cost under hard voltage, capacity, current, spacing,
envelope, and temperature constraints.

BattMo/PyBattMo integration is intentionally deferred in this release to avoid
Julia runtime/tooling coupling in the core benchmark path.
'''
