problem_id = "battery_pack_18650_open_ended_capacity_max"
title = "T3B 18650 open-ended battery-pack co-design (capacity maximization)"
summary = "A transition-program optimization variant that searches explicit 18650 cell placement and wiring decisions to maximize delivered capacity under the shared battery backend."
kind = "optimization"
statement = '''
# T3B 18650 open-ended battery-pack co-design (capacity maximization)

Search an explicit 18650 battery-pack design by choosing a fixed-length
transition program over the library's open-ended cell-and-wire grammar. Each
transition token selects one valid add-cell, move-cell, wire, unwire, or
terminal-reassignment action from the current explicit battery graph.

The objective is to maximize delivered capacity while still meeting the
packaged voltage, capacity, current, and envelope requirements. This
optimization-family benchmark reuses the same explicit battery backend as the
open-ended grammar problem, but it exposes the search as a bounded numeric
optimization interface instead of a grammar-family state/action interface.
'''
implementation = "design_research_problems.problems.optimization._battery_open_ended:BatteryOpenEndedCapacityMaxProblem"
capabilities = ["statement-markdown", "bounded-variables", "baseline-solver"]
study_suitability = []

[parameters]
target_voltage_v = 14.8
minimum_capacity_ah = 10.0
minimum_current_a = 60.0
max_width_mm = 500.0
max_depth_mm = 500.0
max_height_mm = 250.0
voltage_tolerance_v = 0.1
max_cell_count = 24

[taxonomy]
formulation = "mixed_discrete_optimization"
convexity = "nonconvex"
design_variable_type = "discrete"
is_dynamic = false
orientation = "engineering_practical"
feasibility_ratio_hint = 0.02
objective_mode = "single"
constraint_nature = "hard"
bounds_summary = "32 bounded transition-selector tokens over the explicit battery grammar with a 24-cell cap"
tags = ["optimization", "battery", "graph-netlist", "layout", "co-design", "capacity"]
