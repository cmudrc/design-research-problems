problem_id = "treadle_pump_ide_material_min"
title = "IDE-style treadle pump material minimization problem"
summary = "A citation-backed nonlinear optimization benchmark that fixes a low-flow Zone I IDE-style treadle-pump operating point and minimizes a reduced material-volume proxy."
kind = "optimization"
statement = '''
# IDE-style treadle pump material minimization problem

This packaged optimization problem is a scalarized, citation-backed surrogate
derived from the published IDE-style treadle pump studies. It fixes a low-flow
Zone I operating point at 2.5 L/s and 1.9 m suction lift, then minimizes a
reduced material-volume proxy for the pump.

To fit the current single-objective API cleanly, the packaged instance uses
four continuous design variables: cylinder radius, hose radius, treadle
length, and stepping cadence. The built-in baseline solver searches over the
two primary geometric variables and analytically reconstructs the hose radius
and cadence needed to satisfy the flow and lift equalities at each candidate.
'''
implementation = "design_research_problems.problems.optimization._ide_treadle:IDETreadlePumpMaterialMin"
capabilities = [
  "statement-markdown",
  "citation-backed",
  "bounded-variables",
  "equality-constraint",
  "baseline-solver",
]
