problem_id = "battery_18650_t3_topology_opt"
title = "Tier 3 18650 battery optimization (topology + layout)"
summary = "Tier-3 optimization problem with stable typed topology variables, variable cell count, and full per-cell poses."
kind = "optimization"
statement = '''
# Tier 3 18650 battery optimization (topology + layout)

Optimize battery layouts with typed topology variables (cell count, stage
assignment) and full pose variables. This tier replaces transition-index
encodings with a stable decision schema tied to physical/topological variables.
'''
implementation = "design_research_problems.problems.optimization._battery_tiers:Battery18650Tier3TopologyOptimizationProblem"
capabilities = ["statement-markdown", "bounded-variables", "baseline-solver"]
study_suitability = []

[parameters]
target_voltage_v = 14.8
minimum_capacity_ah = 10.0
minimum_current_a = 60.0
max_width_mm = 500.0
max_depth_mm = 500.0
max_height_mm = 250.0
voltage_tolerance_v = 0.1
max_cell_count = 24
minimum_spacing_mm = 2.0
cooling_coefficient_w_per_m2k = 18.0
passive_cooling_w_per_k = 1.0
ambient_temperature_c = 25.0
maximum_temperature_c = 60.0
load_current_a = 60.0
objective_weights = { volume = 0.40, cost = 0.30, temperature = 0.30 }

[taxonomy]
formulation = "mixed_discrete_optimization"
convexity = "nonconvex"
design_variable_type = "mixed"
is_dynamic = false
orientation = "engineering_practical"
feasibility_ratio_hint = 0.03
objective_mode = "single"
constraint_nature = "hard"
bounds_summary = "cell-count and stage-assignment topology schema plus per-cell poses"
tags = ["optimization", "battery", "tiered", "tier-3", "topology", "layout"]
