problem_id = "moneymaker_hip_pump_cost_min"
title = "MoneyMaker Hip Pump cost minimization problem"
summary = "A citation-backed nonlinear optimization benchmark that fixes a target flow and tank head, then minimizes projected pump cost using a scalarized form of the MoneyMaker Hip Pump studies."
kind = "optimization"
statement = '''
# MoneyMaker Hip Pump cost minimization problem

This packaged optimization problem is a scalarized subproblem derived from
the published multi-objective MoneyMaker Hip Pump studies. It uses the
epsilon-constraint pattern from the papers: the delivery head is fixed at 3 m,
the target flow rate is fixed at 0.18 L/s, and the scalar objective is the
projected pump cost.

To fit the current single-objective API cleanly, the packaged instance reduces
the original 16 design variables to 10 independent continuous variables. The
remaining geometric relationships and fixed deployment assumptions are
reconstructed internally from the cited formulation. Bounds are centered on the
published tall-tank designs so the packaged benchmark stays well-conditioned
without changing the shared optimization base classes.
'''
implementation = "design_research_problems.problems.optimization._moneymaker:MoneyMakerHipPumpProblem"
capabilities = [
  "statement-markdown",
  "citation-backed",
  "bounded-variables",
  "equality-constraint",
  "baseline-solver",
]
