problem_id = "battery_18650_t2_pose_surrogate_opt"
title = "T2 18650 pose surrogate optimization"
summary = "Tier-2 pose-aware battery layout benchmark with switchable analytic, promoted explicit-circuit, or promoted hybrid-thermal scoring."
kind = "optimization"
statement = '''
# T2 18650 pose surrogate optimization

Optimize rectangular battery packs with full per-cell pose freedom using
[x,y,z,angle_x,angle_y,angle_z] variables under spacing and envelope
constraints.

Tier-2 keeps tier-1 electrical topology semantics (S and P) but unlocks 3D
pose decisions for each potential active cell.

Geometry model:
- Each cell is an oriented finite cylinder.
- Feasibility uses minimum surface clearance between cell bodies.
- Envelope dimensions come from the axis-aligned bounding box.
- V_design = width * depth * height.

Electrical and thermal terms follow the same baseline approximation as tier-1:
- V_pack ~= S * V_cell
- C_pack ~= P * C_cell
- I_cell = I_load / P
- Q_dot = N_cells * I_cell^2 * R_int
- T_max = T_ambient + Q_dot / (G_passive + hA)
'''
implementation = "design_research_problems.problems.optimization._battery_tiers:Battery18650T2PoseSurrogateOptimizationProblem"
capabilities = ["statement-markdown", "bounded-variables", "baseline-solver"]
study_suitability = []

[benchmark]
benchmark_question = "How well do methods handle continuous pose and packing decisions when electrical and thermal behavior remain surrogate-level?"
physically_modeled = [
  "Finite-cylinder collision and clearance geometry",
  "Bounding-box envelope and design volume",
  "Steady-state thermal proxy under a fixed load",
]
deliberate_surrogates = [
  "Topology remains rectangular and electrically analytic",
  "Backend configuration is accepted for provenance but not applied end-to-end",
  "Thermal behavior remains low-order rather than transient electro-thermal simulation",
]
representation_mode = "pose_layout"
default_evaluation_mode = "analytic_surrogate"
supported_evaluation_modes = ["analytic_surrogate", "explicit_circuit", "hybrid_thermal"]
validation_scope = [
  "Geometric validity checks",
  "Monotonicity and deterministic surrogate checks",
]
solver_role = "deterministic baseline search"

[parameters]
evaluation_mode = "analytic_surrogate"
target_voltage_v = 14.8
minimum_capacity_ah = 10.0
minimum_current_a = 60.0
max_width_mm = 500.0
max_depth_mm = 500.0
max_height_mm = 250.0
voltage_tolerance_v = 0.1
max_cell_count = 24
minimum_spacing_mm = 2.0
cooling_coefficient_w_per_m2k = 18.0
passive_cooling_w_per_k = 1.0
ambient_temperature_c = 25.0
maximum_temperature_c = 60.0
load_current_a = 60.0
objective_weights = { volume = 0.45, cost = 0.35, temperature = 0.20 }

[taxonomy]
formulation = "mixed_discrete_optimization"
convexity = "nonconvex"
design_variable_type = "mixed"
is_dynamic = false
orientation = "engineering_practical"
feasibility_ratio_hint = 0.05
objective_mode = "single"
constraint_nature = "hard"
bounds_summary = "series/parallel plus per-cell pose variables for up to max_cell_count cells"
tags = ["optimization", "battery", "tiered", "tier-2", "pose-layout", "surrogate"]
