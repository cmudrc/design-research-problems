problem_id = "worker_hours_competing_projects_value_tracking_min"
title = "Competing design projects worker-hours allocation (value-tracking minimization)"
summary = "A citation-backed daily worker-allocation benchmark that packages the explicit 2015 competing-projects case as a compact value-tracking optimization problem."
kind = "optimization"
statement = '''
# Competing design projects worker-hours allocation (value-tracking minimization)

This packaged optimization problem is a compact, citation-backed seed derived
from Freiheit's 2015 competing-projects personnel-allocation study. The paper
frames the allocation as a predictive-control problem. This in-package
benchmark keeps the published 60-day horizon, project tables, worker
availability matrix, worker capability discounts, and cycloidal value-growth
model, then packages them as a fully specified daily hour-allocation problem.

Each continuous design variable gives the hours assigned from one worker to one
project or project phase on one day. The packaged objective minimizes the
squared deviation between achieved and target value growth over the planning
horizon, with lightweight penalties for abrupt assignment changes and hours
spent on inactive or already-complete work. The built-in baseline solver uses a
deterministic greedy planner that chases the published value-growth targets.
'''
implementation = "design_research_problems.problems.optimization._worker_hours_allocation:CompetingProjectsWorkerHoursProblem"
capabilities = [
  "statement-markdown",
  "citation-backed",
  "bounded-variables",
  "baseline-solver",
]
study_suitability = []

