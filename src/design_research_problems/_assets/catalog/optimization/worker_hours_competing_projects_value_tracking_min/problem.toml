formatted_text = "Freiheit (2015)."
raw_text = "Freiheit, T. (2015). Optimal Allocation of Worker Hours to Competing Design Projects to Meet Value Growth Targets. Proceedings of the ASME 2015 International Design Engineering Technical Conferences and Computers and Information in Engineering Conference, DETC2015-47818."

