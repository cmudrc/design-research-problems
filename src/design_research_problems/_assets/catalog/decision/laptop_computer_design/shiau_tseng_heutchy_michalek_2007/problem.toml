unit = "inch"
lower_bound = 10.0
upper_bound = 17.0

[[parameters.decision_variable_specs]]
symbol = "x2"
label = "Body width"
unit = "inch"
lower_bound = 5.0
upper_bound = 20.0

[[parameters.decision_variable_specs]]
symbol = "x3"
label = "Body depth"
unit = "inch"
lower_bound = 5.0
upper_bound = 20.0

[[parameters.decision_variable_specs]]
symbol = "x4"
label = "Body thickness"
