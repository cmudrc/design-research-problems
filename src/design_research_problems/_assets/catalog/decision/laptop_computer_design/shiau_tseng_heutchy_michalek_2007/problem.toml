[[parameters.objective_specs]]
key = "market_share_proxy"
label = "Discrete part-worth market-share proxy"
sense = "maximize"
domain = "discrete-option"
expression = "exp(u_new) / (exp(u_new) + sum(exp(u_comp_i)))"
variables = ["z1", "z2", "z3", "z4", "z5"]
executable = true

[[parameters.constraint_specs]]
key = "g1"
label = "Minimum non-battery volume"
relation = "<="
domain = "continuous-design"
expression = "100 - (x2 * x3 * x4) * (1 - x5)"
variables = ["x2", "x3", "x4", "x5"]
executable = false

[[parameters.constraint_specs]]
key = "g2"
label = "LCD width fit"
relation = "<="
domain = "continuous-design"
expression = "x1 * sqrt(1 + a^(-2)) + 2 * mLCD - x2"
variables = ["x1", "x2"]
executable = false

[[parameters.constraint_specs]]
key = "g3"
label = "LCD depth fit"
relation = "<="
domain = "continuous-design"
expression = "x1 * sqrt(1 + a^2) / a + 2 * mLCD - x3"
variables = ["x1", "x3"]
executable = false

[[parameters.constraint_specs]]
key = "g4"
label = "Minimum battery life"
relation = "<="
domain = "continuous-design"
expression = "1 - (160 * x2 * x3 * x4 * x5 * rB - 5.69) / Pavg"
variables = ["x2", "x3", "x4", "x5"]
executable = false

[[parameters.constraint_specs]]
key = "g5"
label = "Maximum total weight"
relation = "<="
domain = "continuous-design"
expression = "rV * (x2 * x3 * x4) * (1 - x5) + rB * (x2 * x3 * x4) * x5 - 10"
variables = ["x2", "x3", "x4", "x5"]
executable = false

