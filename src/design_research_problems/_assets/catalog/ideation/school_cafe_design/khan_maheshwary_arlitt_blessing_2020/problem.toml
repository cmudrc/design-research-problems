problem_id = "ideation_school_cafe_design"
title = "School Cafe Design"
summary = "A school-space design brief about converting an unused room into a cafe that better serves the school community."
kind = "text"
statement = '''
# School Cafe Design

Your school has an unused room and your principal would like to
convert it into a cafe for all students, parents, teachers and
staff of your school.

Each class is required to submit ideas of how the new cafe could
be designed to better serve the members of the school as a design
challenge. Based on your team's interpretation of common needs
of the school population, illustrate an ideal design for the cafe.

You may use diagrams, annotations, and sketches to support the
explanation. Describe your design proposal and explain the
rationale behind the design feature incorporated.
'''
capabilities = ["statement-markdown", "citation-backed", "prompt-packet"]
study_suitability = ["human-subjects-ready", "ideation-friendly"]

