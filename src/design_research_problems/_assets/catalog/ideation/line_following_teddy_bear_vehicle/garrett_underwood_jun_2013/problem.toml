kind = "text"
statement = '''
# Line-Following Teddy-Bear Vehicle

Design an automated line-following vehicle for teddy-bear
passengers.

The vehicle should:

- complete a time trial around a simple oval track
- carry two different passengers
- support switching passengers quickly at the midpoint of the
  time trial
- be developed through iterative design, construction, and
  testing
'''
