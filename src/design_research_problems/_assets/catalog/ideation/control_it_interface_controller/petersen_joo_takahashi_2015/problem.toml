problem_id = "ideation_control_it_interface_controller"
title = "Control-It Interface Controller"
summary = "A classroom brief about designing a controller with a screen and physical controls for a chosen market segment."
kind = "text"
statement = '''
# Control-It Interface Controller

Find your market segment and specify the controller, explore
customer profile, user experience and expectations, form language,
material and colour.

Assemble and present the findings together with your concept
conclusion (hypothesis). Two must haves are that the product includes
a screen and some dials or buttons interacting with each other and
controlling some object or process.

Develop your design through intense sketch work and create an
interface design and orthographic views before starting your 3D
model. You are not allowed to start a 3D model before the design
development has been completed.
'''
