problem_id = "ideation_out_of_reach_book_retrieval_original"
title = "Ideation Prompt - Out-of-Reach Book Retrieval (Original)"
summary = "The original library-shelf retrieval brief used by Cardoso and Badke-Schaub (2011)."
kind = "text"
statement = '''
# Ideation Prompt - Out-of-Reach Book Retrieval (Original)

Design a device that allows people to pickup a book from a shelf (e.g. in a
library) that is out of their reach, for instance, above their head.

In addition to sketches, add short written explanations if needed to complement
the design (for instance, in terms of mechanisms, principles, materials, or
related details).

Generate solution ideas that take into account the following criteria:

- Ease of use: level of usability in terms of how easy and comfortable it would
  be for a user to retrieve a book using it.
- Manufacture: feasibility of building such a device using existing
  technologies.
- Minimised book damage: likelihood of a book being damaged during retrieval.
'''
