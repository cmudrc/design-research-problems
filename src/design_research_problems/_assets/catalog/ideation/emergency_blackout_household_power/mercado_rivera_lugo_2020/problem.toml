summary = "A household-energy design challenge about supplying essential appliances during emergency blackouts for low-income households in Puerto Rico."
kind = "text"
statement = '''
# Emergency Blackout Household Power

Design Challenge: How might we supply electric energy for
essential household appliances during emergency blackout
situations for low-income people in Puerto Rico?

Design Directives:

- Product should be affordable.
- Product should work indoors.
- Product should operate quietly.
- Product should be weather-proof.
- Product should be easy to set up and use.
- Product should be portable.
- Product should work with access to four hours of sunlight.
'''
