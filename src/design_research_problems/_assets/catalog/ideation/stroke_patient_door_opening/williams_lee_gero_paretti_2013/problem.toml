problem_id = "ideation_stroke_patient_door_opening"
title = "One-Handed Door Opening for Stroke Patients"
summary = "A rehabilitation-device brief about helping stroke patients unlock and open a door with one hand."
kind = "text"
statement = '''
# One-Handed Door Opening for Stroke Patients

Your design team has been hired by the Metropolitan
Rehabilitation Institute, the leading rehabilitation hospital in
the country, to design a new device to help stroke patients open
doors.

Many individuals who have had a stroke are unable to perform
bilateral tasks, meaning they have limited or no use of one
upper extremity. It is particularly difficult for these people
not only to unlock and turn the knob but also to push or pull
the door open. Your design team has been asked to create a
system that allows a person to unlock and open the door at the
same time with one hand.
'''
