problem_id = "ideation_personal_alarm_clock"
title = "Personal Alarm Clock"
summary = "A portable low-disturbance alarm-clock brief for shared spaces where conventional alarms would bother others."
kind = "text"
statement = '''
# Personal Alarm Clock

Alarm clocks are widely used to help individuals wake from
slumber. However, when used in shared spaces like dorm rooms,
they will often disturb those around them. The goal of this
problem is to design a low-cost alarm clock for individual use
that will not disturb others. The clock should be portable for
use in a variety of situations such as on the bus, in the library,
or in a classroom.

Customer Needs:

- Must wake up individual with no disturbance to others
- Must be portable and lightweight
- Must be safe for user
- Electrical outlets are not available as a constant power source
- Low cost
'''
