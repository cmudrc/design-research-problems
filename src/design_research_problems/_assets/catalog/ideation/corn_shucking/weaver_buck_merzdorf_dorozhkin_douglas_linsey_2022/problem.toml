title = "Corn Shucker for Mass Production"
summary = "A primary-source agricultural ideation brief about quickly and cheaply removing husk and silk from corn for mass production."
kind = "text"
statement = '''
# Corn Shucker for Mass Production

Corn is currently the most widely grown crop in the Americas with the United
States producing 40% of the world's harvest. An ear of corn has a protective
outer covering of leaves, known as the husk, and strands of corn silk threads
run between the husk and the kernels. The removal of husk and silk to clean
the corn is known as shucking corn. Design a device that quickly and cheaply
shucks corn for mass production.

Customer Needs:

- Must remove husk and silk from corn cob with minimal damage to kernels.
- A large quantity of corn must be shucked quickly.
- Must be safe for user.
- Low cost.
- Easy to manufacture.

Please sketch and note (with words) one design solution per page starting on
the next page.
'''
