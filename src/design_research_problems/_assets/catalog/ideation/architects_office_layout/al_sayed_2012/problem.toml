title = "Architect's Office Layout"
summary = "An architectural layout brief about allocating a complete office program within a constrained skyscraper floor plan."
kind = "text"
statement = '''
# Architect's Office Layout

Allocate the required spaces for an architect's office within a
given one-level rectangular floor plan in a skyscraper,
prioritising circulation.

Required spaces:

- head office and private secretary space
- waiting area with small exhibition
- two meeting rooms
- 3-4 management offices
- two telecommunication offices
- three consultant spaces
- five design-team spaces
- two IT offices
- two technical studies units
- one construction expertise unit
- two service areas with kitchenette
'''
