problem_id = "ideation_long_range_dtss_inspection"
title = "Long-range DTSS Inspection"
summary = "A figure-based aerial-robot design brief for long-endurance visual inspection of a deep tunnel sewerage network."
kind = "text"
statement = '''
# Long-range DTSS Inspection

Aerial robots as ideal platforms:

- Deployment and retrieval simplicity
- Challenging terrain

The task demands long endurance of more than 30 mins and a 3 m/s inspection
pace. The brief also calls for:

- greater than 30 m autonomous ascend and descend
- 5 km autonomous navigation between adjacent shaft access points
- 360 degree visual inspection of the tunnel inner surface

Design Specification:

- Efficiency
  - Battery
    - operate for more than 30 mins
  - Sensing
    - collision avoidance
    - localization
- Challenge
  - SWaP
    - size: less than 1.2 m radius
    - power: minimal to last 30 mins
  - VUCA
    - dark, featureless
'''
