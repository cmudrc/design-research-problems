kind = "text"
statement = '''
# Ideation Prompt - Measuring Cup for Blind Users (Original)

Design a volume-measuring device for cooking by visually impaired users.

The device should:

- be easy to operate
- work with powders and liquids
- minimize waste
- measure from 1/4 cup to 2 cups
- avoid splatter
- be easy to clean
- be low cost
'''
