title = "Antarctica Immersive Museum"
summary = "A museum-design brief about creating a mobile, eco-friendly concept that immerses visitors in an Antarctica-like world."
kind = "text"
statement = '''
# Antarctica Immersive Museum

Elaborate a breakthrough museum concept that gives the visitor an
immersive experience in an Antarctica-like world.

The museum should:

- make people sensitive to the imperative of protecting Antarctica
- be mobile and deployable worldwide
- be practical to install and transport
- be as eco-friendly as possible
- have a size of approximately 3,600 m2
'''
