title = "Workshop Plate Holder"
summary = "A workshop-fixture brief about holding two wood plates together for gluing and drilling."
kind = "text"
statement = '''
# Workshop Plate Holder

A homeowner, in the workshop, needs to hold two plates of wood
together for different activities.

As a first example, the plates of wood need to be held in place as
they are glued together and the glue cures. As a second example, the
plates are held in place while a hole is drilled through them at the
same time.
'''
