# Parallel Tube Wall Mount

You are tasked with designing a solution to hold three hollow tubes
securely in place and parallel to each other. All tubes must be held
2 inches away from a fixed wall (measuring from the wall to the closest
edge of the tubes). The tubes are 1 inch in diameter and 3 inches long.
'''
