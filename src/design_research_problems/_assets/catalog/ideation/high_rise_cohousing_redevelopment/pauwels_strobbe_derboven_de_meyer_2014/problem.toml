problem_id = "ideation_high_rise_cohousing_redevelopment"
title = "High-Rise Cohousing Redevelopment"
summary = "An architectural redevelopment brief about rethinking three outdated Antwerp towers through a cohousing lens."
kind = "text"
statement = '''
# High-Rise Cohousing Redevelopment

Design an alternative concept for three outdated high-rise
apartment buildings in Antwerp, Belgium, and investigate how
cohousing can be accommodated in this building type.

The site must incorporate about 300 living units, facilities for
cohousing, and sufficient parking, while addressing sunlight,
safety and comfort, fire safety and accessibility, privacy, wind
turbulence, and structural constraints.
'''
