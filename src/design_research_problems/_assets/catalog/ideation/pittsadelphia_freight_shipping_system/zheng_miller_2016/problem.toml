title = "Pittsadelphia Freight Shipping System"
summary = "A first-year engineering design brief about lowering freight-related smog for a fictional port city while preserving shipping capacity."
kind = "text"
statement = '''
# Pittsadelphia Freight Shipping System

Pittsadelphia is looking for the design of a cost-effective
freight shipping system that reduces smog and meets EPA
requirements, while maintaining or increasing freight capacity
into and out of this important port city.

Suggestions provided with the prompt included upgrading the
locomotive fleet to meet more recent EPA emissions guidelines
and adopting alternate freight shipping methods.
'''
