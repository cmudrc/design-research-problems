problem_id = "ideation_shot_buddy_basketball_return"
title = "Shot Buddy Basketball Return"
summary = "A basketball training-device brief focused on returning made or missed shots to the shooter from different positions."
kind = "text"
statement = '''
# Shot Buddy Basketball Return

Design the shot buddy, a device which could return shot
basketballs to the shooter, whether the basket was made or
missed. The device must be able to automatically adjust the
return angle based on the position of the shooter when the ball
is shot. The shooter may be initially located anywhere within a
25' semicircle with respect to the basket. It must also
accurately and quickly return balls to the shooter and not block
the shooter's access to the basket. Ideally, the return speed
would be adjustable to accommodate different skill levels. The
device should be user friendly for kids ages 10-18, easy to
setup and applicable to a wide variety of basket types. The
device should be affordable for the average family.
'''
