problem_id = "ideation_collaborative_study_space"
title = "Collaborative Study Space"
summary = "A campus-space ideation prompt about preserving collaboration while reducing distraction in study environments."
kind = "text"
statement = '''
# Collaborative Study Space

The College prides itself on fostering a collaborative academic
environment. This environment is possible largely due to the design
of the student spaces. There is a trade-off, however; with some of
these design choices (e.g., glass walls), comes distraction.

You are tasked with generating new solutions that enable collaboration
in your desired study spaces while limiting distractions as much as
possible. There are no wrong answers - solutions of all kinds are
welcome!
'''
