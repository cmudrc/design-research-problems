problem_id = "ideation_sustainable_washing_machine"
title = "Sustainable Washing Machine"
summary = "A primary-source sustainable-appliance ideation brief for designing the next generation of a washing machine with lower resource use and stronger user appeal."
kind = "text"
statement = '''
# Sustainable Washing Machine

Imagine that you are working on a product design team at Smithfield
Appliances, and you have been asked to design the next generation of
sustainable washing machine. Product ideas may be related to reducing water
and energy usage, improving manufacturing, and increasing the product's appeal
to users. Generate ideas that address this design challenge. You may use
scratch paper if necessary but please type all individual ideas in the boxes
below. You do not have to fill in all of the boxes. You will have 8 min to
complete this task.
'''
capabilities = ["statement-markdown", "citation-backed", "prompt-packet"]
study_suitability = ["human-subjects-ready", "ideation-friendly"]

