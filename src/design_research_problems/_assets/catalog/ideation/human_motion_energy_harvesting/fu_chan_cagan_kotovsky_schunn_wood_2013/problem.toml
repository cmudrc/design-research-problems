problem_id = "ideation_human_motion_energy_harvesting_rural_communities"
title = "Ideation Prompt - Human Motion Energy for Rural Communities"
summary = "The full participant-facing design brief printed in Fu et al. (2013) for the human-motion energy harvesting task, with the underlying task introduced in Chan et al. (2011)."
kind = "text"
statement = '''
# Ideation Prompt - Human Motion Energy for Rural Communities

Design a device to collect energy from human motion for use in
developing and impoverished rural communities in places like India
and many African countries. Our goal is to build a low-cost, easy to
manufacture device targeted at individuals and small households
to provide energy to be stored in a rechargeable battery with
approximately 80% efficiency. The energy is intended to be used by
small, low power draw electrical devices, such as a radio or lighting
device, hopefully leading to an increase in the quality of life of the
communities by increasing productivity, connection to the outside
world, etc. The target energy production is 1 kW-h per day, roughly
enough to power eight 25 W compact florescent light bulbs for 5 h
each per day, or enough to power a CB radio for the entire day.

For reference, an average adult human can output about 200 W
with full body physical activity for short periods of time, with a
significant reduction for sustained power output.
'''
capabilities = ["statement-markdown", "citation-backed", "prompt-packet"]
study_suitability = ["human-subjects-ready", "ideation-friendly"]

