title = "Lego-Block Scrapyard Collection"
summary = "A competitive course-design brief about collecting Lego blocks from a scrapyard and dumping them into a bin."
kind = "text"
statement = '''
# Lego-Block Scrapyard Collection

Design a device that collects Lego blocks from a scrapyard
and dumps them into a bin either through a ramp or a trap
door. The device should fit in an 18 x 18 x 18 envelope prior
to the starting position. Human contact with the device is not
allowed once it begins operation. Two minutes are given to set
up the device at the start line and 3 minutes to do the job. The
number of objects one can put in the bin determines the score.
'''
