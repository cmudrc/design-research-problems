title = "Interactive Parking Meter Kiosk"
summary = "A public-service brief about transforming a parking meter into an interactive kiosk."
kind = "text"
statement = '''
# Interactive Parking Meter Kiosk

If you transform a pay and display parking meter into an
interactive kiosk, what application or service useful in your
everyday life should be available?

The proposal should:

- not affect the appearance of the housing
- be relevant to a larger community
- use one or more of the terminal's functionalities
- be useful now or in the very near future
'''
