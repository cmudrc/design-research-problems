kind = "text"
statement = '''
# Peanut Shelling Machine for Haiti and West Africa

In places like Haiti and certain West African countries, peanuts are a
significant crop. Most peanut farmers shell their peanuts by hand, an
inefficient and labor-intensive process. The goal of this project is to
design and build a low-cost, easy to manufacture peanut shelling machine
that will increase the productivity of the African peanut farmers.

Customer needs:

- Remove the shell with minimal damage to the peanuts.
- Electrical outlets are not available as a power source.
'''
