summary = "A reconstructed root peanut-shelling brief from Linsey, Green, Murphy, Wood, and Markman (2005)."
kind = "text"
statement = '''
# Ideation Prompt - Peanut Shelling (Root Study)

Design a device to quickly shell peanuts for use in places like Haiti and West
African countries.

The current solution is to shell the peanuts by hand, and no electrical energy
sources are available.

Customer needs described in the study include:

- Low cost.
- Easy to manufacture.
- Quickly shell a large quantity of peanuts.
- Remove the shell with minimal damage to the peanuts.
'''
