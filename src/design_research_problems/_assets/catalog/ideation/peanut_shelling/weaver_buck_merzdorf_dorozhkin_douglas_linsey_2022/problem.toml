kind = "text"
statement = '''
# Peanut Shelling Machine With 50 kg/h Throughput

In places like Haiti and certain West African countries, peanuts are a
significant crop. Most peanut farmers shell their peanuts by hand, an
inefficient and labor-intensive process. The goal of this project is to
design and build a low-cost, easy to manufacture peanut shelling machine
that will increase the productivity of the African peanut farmers. The
target throughput is approximately 50 kg (110 lbs.) per hour.

Customer Needs:

- Must remove the shell with minimal damage to the peanuts.
- Electrical outlets are not available as a power source.
- A large quantity of peanuts must be quickly shelled.
- Low cost.
- Easy to manufacture.

Please sketch and note (with words) one design solution per page starting on
the next page.
'''
