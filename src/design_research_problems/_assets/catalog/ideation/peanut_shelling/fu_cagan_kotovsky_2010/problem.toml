problem_id = "ideation_peanut_shelling_fu_cagan_kotovsky_2010"
title = "Device to shell peanuts"
summary = "The full control-group peanut-sheller prompt printed by Fu, Cagan, and Kotovsky (2010), with the underlying task tracing back to the original Linsey, Green, Murphy, Wood, and Markman (2005) study."
kind = "text"
statement = '''
# Device to shell peanuts

In places like Haiti and certain West African countries, peanuts are a
significant crop. Most peanut farmers shell their peanuts by hand, an
inefficient and labor-intensive process. Our goal is to build a low-cost,
easy to manufacture peanut sheller targeted at individuals and small
cooperatives that will increase the productivity of the peanut farmers.
Further, this peanut sheller should be manufacturable with materials that are
readily available in the target communities. Our target throughput is
approximately 50 kg (110 lbs) per hour.

# Customer Needs

- Must remove the shell with minimal damage to the peanuts.
- Electrical outlets are not available as a power source.
- A large quantity of peanuts must be quickly shelled.
- Low cost.
- Easy to manufacture.
'''
