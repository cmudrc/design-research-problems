title = "Hoist Chain Spill Prevention"
summary = "A reconstructed safety-design brief about preventing slack chain from spilling out of hoist collection bags."
kind = "text"
statement = '''
# Hoist Chain Spill Prevention

At the Royal Albert Hall, lengths of slack chain from electric
chain hoists can occasionally spill from collection bags,
posing possible risks to people below.

Generate new ideas to prevent or better manage this chain spill
problem. The solution should improve or modify the existing
system without defaulting to impractical rigid industrial bags.
'''
