problem_id = "ideation_flexible_fire_station_deployment"
title = "Flexible Fire Station Deployment"
summary = "A reconstructed emergency-services problem-solving brief about deploying fire stations under uncertainty."
kind = "text"
statement = '''
# Flexible Fire Station Deployment

Develop a fire-station deployment and operations strategy for a
hypothetical city in Asia.

Use a provided five-sector city map, travel-time estimates,
current fire rates, and basic, enhanced, and privatized station
options to propose a strategy that:

- responds quickly to fire-related emergency calls
- balances average response time against lifecycle cost
- accounts for uncertain future fire rates
- handles the possibility that a new factory may be built in one
  of the city's sectors
'''
