# Burrito Making Device

The Mechanical Engineering Department is hosting a tailgate
party and has invited alumni. The department wishes to feed
burritos to a party of 100 during the half time. The task for
manually making the burritos for these many people is
laborious. Thus the goal is to design a burrito making device
for the department.
'''
