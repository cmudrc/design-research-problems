problem_id = "ideation_temporary_hospital_shelter_bop"
title = "Temporary Hospital Shelter for BOP Communities"
summary = "An emergency-design brief about rapidly deployable temporary hospital shelters for a disease outbreak in BOP communities."
kind = "text"
statement = '''
# Temporary Hospital Shelter for BOP Communities

A highly contagious and deadly disease called "anthrax-d5" is
spreading across a cluster of BOP communities in a developing
country. This disease is transmitted only through contaminated food
and water. A person infected with this disease needs to be
hospitalized in order to save his/her life.

The spread of this disease is such that the existing healthcare
infrastructure (i.e. available number of hospitals) is inadequate to
hospitalize and treat the large number of infected people. There is an
urgent need to erect a number of temporary shelters that can be used
as hospitals.

For the cluster of BOP communities, where the "anthrax-d5" is
spreading at an enormous rate, design such a temporary shelter that
can be used to hospitalize 5 infected people (per shelter). Each
shelter also needs to accommodate basic healthcare facilities and
healthcare staff consisting of 1 nurse. The time to install this
shelter must be less than 2 hours. The shelter also needs to
withstand different types of weather conditions.
'''
