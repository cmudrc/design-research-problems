problem_id = "ideation_wheelchair_peach_picking"
title = "Wheelchair Peach Picking"
summary = "A study-specific ASME ideation brief about manually picking peaches while staying in a wheelchair."
kind = "text"
statement = '''
# Wheelchair Peach Picking

People in wheel chair have a very limited range of reach
especially for heights. With this limitation, they cannot
experience pleasures such as that of picking peaches in
summer. Design a device that will allow users in wheel
chair to experience the joy of picking peaches from the tree
and collect it in a basket while still in the wheel chair. The
device must be manually operated and prevent damage to
the fruit while picking it. The fruit should not fall on the
ground while picking.
'''
