problem_id = "ideation_wheelchair_peach_picking"
title = "Wheelchair Peach Picking"
summary = "A participant-facing ASME ideation brief about helping a wheelchair user pick peaches with family while avoiding fruit damage."
kind = "text"
statement = '''
# Wheelchair Peach Picking

Emma is a 19-year-old mechanical engineering student at Clemson. She
suffered a car accident couple of years back which left her in a
wheelchair. Before the accident Emma loved the outdoors and picking
fruits with her family. During the next summer break, she and her
family have decided to go picking peaches. Since she is in a
wheelchair, she has a limited range of reach, especially for height. Due
to this limitation, she cannot experience the pleasure of picking
peaches with her family. For her 20th birthday her family has decided
to surprise her with a device that will help her pick peaches while in a
wheelchair.

The family has asked Clemson University to help design a device that
will allow Emma, who is in a wheelchair, to experience the joy of
picking peaches from the tree with her whole family.

The family would like the device to:

- be manually operated
- be attached to the wheelchair
- not damage the fruit
- keep the fruit from falling on the ground while picking
- cost no more than 100 dollars
'''
capabilities = ["statement-markdown", "citation-backed", "prompt-packet"]
study_suitability = ["human-subjects-ready", "ideation-friendly", "requirements-study-ready"]

