kind = "text"
statement = '''
# Mountain-TREK Joint Immobilization

Mountain-TREK (MTREK) is an outdoor wilderness company that organizes backpacking trips to the
mountains throughout the year. During these trips, MTREK utilizes trip guides to lead a group of
participants through these wilderness expeditions. For safety reasons, MTREK requires each of its
guides to carry emergency kits containing an assortment of medical supplies. These kits contain
items that can be used in the case of sickness, insect bites, wounds, trauma, etc. Due to the other
items outfitted in the guides' packs, available space is limited. In extreme hiking conditions, MTREK
has noticed a significant risk of leg and ankle dislocations and fractures.

## Design challenge

Due to the potential for leg injuries, MTREK is now requiring guides to carry additional supplies to
treat these injuries. In this design challenge, MTREK has hired you to design a device that can be
used to immobilize a joint or limb in case of an extreme injury. This device must (1) be as light and
small as possible when stored in the guides' packs but (2) rigid enough and large enough to
immobilize the leg of an average-sized male.
'''
