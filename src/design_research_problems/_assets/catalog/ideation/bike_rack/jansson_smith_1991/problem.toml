kind = "text"
statement = '''
# Car-Mounted Bicycle Rack

Design a car-mounted bicycle rack.

The design should:

- make the bicycle easy to mount
- make the rack easy to mount
- not harm the bike or the car
- be versatile enough for all bikes and cars
'''
