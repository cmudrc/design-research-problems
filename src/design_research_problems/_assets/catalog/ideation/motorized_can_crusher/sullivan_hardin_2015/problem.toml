problem_id = "ideation_motorized_can_crusher"
title = "Motorized Can Crusher"
summary = "A senior mechanical-design project brief for a lead-screw can crusher controlled by an Arduino."
kind = "text"
statement = '''
# Motorized Can Crusher

Students must design a can crusher that is capable of reducing
a standard aluminum beverage can to a height of 1 in.

Project Requirements:

- The crush force for the device must be produced by a lead
  screw driven by a 40W gear motor; there are no constraints
  on the arrangement of the motor/lead screw system.
- The can crusher is to be controlled by an Arduino
  micro-controller which monitors the status of a pushbutton, a
  micro-switch located at the home or start position of the ram,
  and a micro-switch at the end-of-travel position of the ram.
- When the push button is depressed, the cycle starts by moving
  the ram to its home position if it is not already there, waits
  two seconds to allow a can to be placed ahead of the ram,
  drives the ram against the can, pauses for one second at the
  end of travel, and then returns the ram to its home position.
'''
