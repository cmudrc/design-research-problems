statement = '''
# Office Sit-Stand Table

It is asked to design a new table for offices that allows
alternate sitting and stand up work. There are a lot of people
who must work on sitting position the full day. The possibility
to alternate positions during working time could drive to an
improvement in health and productivity. The current tables
that allow combining positions in work have limited surface,
not enough for design, architecture and engineering needs.
'''
