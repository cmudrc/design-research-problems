title = "Apartment Cooling Problem"
summary = "An everyday problem-solving prompt asking participants to generate ways to keep Judy cool in a hot, humid apartment."
kind = "text"
statement = '''
# Apartment Cooling Problem

Judy complains that her apartment is too hot and humid in the
summer and her fan isn't enough to keep her cool. She asks you
to use your engineering design skills to think of some solutions
to her problem. List as many ideas as you can for ways to keep
Judy cool in her apartment.
'''
