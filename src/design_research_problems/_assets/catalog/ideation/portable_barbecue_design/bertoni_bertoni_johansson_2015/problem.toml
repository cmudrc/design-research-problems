title = "Portable Barbecue Design"
summary = "A preliminary-design task about generating and selecting a portable barbecue concept."
kind = "text"
statement = '''
# Portable Barbecue Design

Conceptualize, design, and select a portable barbecue.

The concept may incrementally or radically innovate an existing
model and should address the needs to be:

- easy to clean
- resistant to rust
- safe
- easy to move and carry
- capable of homogeneous heat distribution on the grilling surface
'''
