problem_id = "ideation_wind_turbine_blade_repurposing"
title = "Wind-turbine Blade Repurposing"
summary = "A sustainability-focused ideation activity about repurposing retired wind-turbine blade sections."
kind = "text"
statement = '''
# Wind-turbine Blade Repurposing

In this next task you will be asked to generate many alternate uses
for different wind-turbine blade sections.

According to the Global Wind Energy Council, as of the end of 2019
there are over 650,000 wind turbine installations globally. As wind
turbines age and retire, their disposal must be considered. Wind
turbine blades are made of materials such as glass-fiber reinforced
polyester to increase lightweightness, stability, and corrosionresistance.
Such composites are often challenging to recycle; therefore, we
must find alternatives to disposal. However, this is also an
opportunity to repurpose the used wind-turbine blades for other
creative uses.

Please do NOT reuse such parts in wind-turbine, airplane or similar
applications that risk safety.

You should maximize the amount of material reused for each part,
which is made of fiber-reinforced composites and not meltable
(high strength/strong, high stiffness/brittle, low density/light).

You will have 10 minutes each to generate alternate uses for a total
of two wind-turbine blade sections.
'''
capabilities = ["statement-markdown", "citation-backed", "prompt-packet"]
study_suitability = ["human-subjects-ready", "ideation-friendly"]

