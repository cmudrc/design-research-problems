problem_id = "ideation_handle_it_handheld_object"
title = "Handle-It Handheld Object"
summary = "A classroom design brief about creating a handheld object for a specific kitchen, bathroom, or garden task."
kind = "text"
statement = '''
# Handle-It Handheld Object

Design a handheld object that performs a specific task in the kitchen,
bathroom or garden. It could be a tool of some sort that cuts, picks,
and holds or any other defined operation.

The object should:

- be mobile and able to be picked up by one person easily
- be with or without mechanics
- show its function clearly to the consumer
- have a handle that lies fully in the user's hand

Think about a wide range of possible users and associated task to
define an interesting object. The function can be very simple and you
can concentrate on the aesthetic, ergonomic and material.
'''
