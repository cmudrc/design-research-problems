problem_id = "ideation_neighborhood_social_connection"
title = "Neighborhood Social Connection"
summary = "A community-design brief about helping Zoe create more opportunities for interaction on her suburban street."
kind = "text"
statement = '''
# Neighborhood Social Connection

Zoe has moved from an inner-city shared house into a quiet suburban
street, near a small park. She has tried to befriend her neighbours
but has noticed a general feeling of social isolation in her street.
She believes that this is because people in the neighbourhood have no
opportunities for interacting-even if/when they want to.

She wants to change this situation and has plenty of time but limited
financial resources to put into this as a "project". The trouble is
that she is not sure where to begin. She has approached you because
you are a designer, to see if you can come up with ideas for ways
that she might approach this problem. She is open to anything that
might work.
'''
