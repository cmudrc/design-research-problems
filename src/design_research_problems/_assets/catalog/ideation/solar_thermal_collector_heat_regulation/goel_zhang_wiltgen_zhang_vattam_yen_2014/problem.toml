# Solar Thermal Collector Heat Regulation

Fix the overheating problem in solar thermal collectors.

Develop a bio-inspired heat regulation system that can fit onto an
existing absorber to constantly maintain suitable temperature, and
a bio-inspired feedback control system that regulates the
temperature of glycol by operating the heat regulation system.
'''
