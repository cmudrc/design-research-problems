title = "Ideation Prompt - Reduce Walking and Texting Accidents (Original)"
summary = "The original campus pedestrian-safety brief used by Miller, Bailey, and Kirlik (2014)."
kind = "text"
statement = '''
# Ideation Prompt - Reduce Walking and Texting Accidents (Original)

There has been an increase in student accidents on campus in recent years from
students texting and or talking on cell phones or listening to music on an MP3
player while walking around campus. While using these devices, students become
distracted and can trip, fall, or even run into something.

In fact, in 2008 over 1,000 pedestrians visited emergency rooms due to
accidents from using these devices while walking. There are reports of
concussions, sprained ankles, broken appendages, and even fatalities from
these accidents. These numbers do not include the countless number of
unreported incidents involving walking into something (for example, a parked
car) without an emergency-room visit. This increase in accidents has been
substantial on college campuses because of the number of students on campus
and the increase of MP3-player and cellular usage, all of which are
distracting.

You have been tasked with developing as many solutions as possible that would
address all or some of the issues associated with this increased accident rate.
These ideas can include either alterations to current technologies or the
design of new technologies to help reduce these accidents.
'''
