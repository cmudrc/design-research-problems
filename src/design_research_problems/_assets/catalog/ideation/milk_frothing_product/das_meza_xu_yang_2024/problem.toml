title = "Milk Frothing Device"
summary = "A full milk-frothing ideation brief reproduced in a 2024 tablet-versus-paper study."
kind = "text"
statement = '''
# Milk Frothing Device

Frothed milk is a pourable, virtually liquid foam that tastes rich and
sweet. It is an ingredient in many coffee beverages, especially
espresso-based coffee drinks (Lattes, Cappuccinos, Mochas). Frothed milk is
made by incorporating very small air bubbles throughout the entire body of
the milk through some form of vigorous motion.

The goal of this project is to design and build a new innovative product
that froths milk in a short amount of time.

Customer needs:

- Froths milk in a short amount of time.
- Minimal instruction needed to use.
'''
